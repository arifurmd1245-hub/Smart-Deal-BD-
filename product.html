<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Smart Deal BD</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .product-details {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 10px;
            background: #f2f2f2;
        }

        h1 {
            margin-top: 20px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            line-height: 1.6;
            color: #555;
        }

        .buy-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background: #ddd;
            color: #222;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h2>Smart Deal BD</h2>
</header>

<div class="container">

    <div class="product-details">

        <img
            id="product-image"
            class="product-image"
            src=""
            alt="Product"
        >

        <h1 id="product-name">Product</h1>

        <div id="product-price" class="price"></div>

        <p id="product-description" class="description"></p>

        <a
            id="buy-button"
            class="buy-button"
            href="#"
            target="_blank"
            rel="noopener"
        >
            Visit Seller
        </a>

        <br>

        <a
            href="index.html"
            class="back-button"
        >
            ← Back to Deals
        </a>

    </div>

</div>
    <script>
console.log("Product JS connected");
    </script>

<script src="product.js"></script>

</body>
</html>
